<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectFlow — Personal Project Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #818cf8;
      --accent-2: #34d399;
      --surface: #0f1117;
      --surface-2: #161b27;
      --surface-3: #1e2536;
      --border: rgba(255,255,255,0.07);
      --text: #e2e8f0;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }
    h1,h2,h3,.font-display { font-family: 'Syne', sans-serif; }
    
    .bg-grid {
      background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
    }
    .glass {
      background: rgba(30, 37, 54, 0.8);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      transition: all 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    
    input, textarea, select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    input::placeholder { color: var(--text-muted); }
    
    .tab-btn { transition: all 0.2s; }
    .tab-btn.active {
      background: rgba(99,102,241,0.15);
      color: #818cf8;
      border-color: rgba(99,102,241,0.3);
    }
    
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-float { animation: floatUp 0.6s ease forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; }
  </style>
</head>
<body class="bg-grid overflow-x-hidden">

  <!-- Background orbs -->
  <div class="glow-orb w-96 h-96 bg-indigo-500 top-0 left-0"></div>
  <div class="glow-orb w-80 h-80 bg-emerald-500 bottom-0 right-0"></div>

  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Logo -->
      <div class="text-center mb-8 animate-float">
        <div class="inline-flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
          </div>
          <h1 class="font-display text-2xl font-bold tracking-tight text-white">ProjectFlow</h1>
        </div>
        <p class="text-sm text-slate-400">Manage your ideas. Ship your goals.</p>
      </div>

      <!-- Auth Card -->
      <div class="glass rounded-2xl p-8 animate-float delay-1">
        
        <!-- Tab switcher -->
        <div class="flex gap-1 p-1 bg-white/5 rounded-xl mb-6">
          <button id="tab-login" onclick="switchTab('login')" 
            class="tab-btn active flex-1 py-2 text-sm font-medium rounded-lg border border-transparent">
            Sign In
          </button>
          <button id="tab-register" onclick="switchTab('register')" 
            class="tab-btn flex-1 py-2 text-sm font-medium rounded-lg border border-transparent text-slate-400">
            Create Account
          </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Email Address</label>
            <input type="email" id="login-email" placeholder="you@example.com" required
              class="w-full px-4 py-2.5 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required
              class="w-full px-4 py-2.5 rounded-xl text-sm" />
          </div>
          <div id="login-error" class="hidden text-red-400 text-xs bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2"></div>
          <button type="submit" id="login-btn"
            class="btn-primary w-full py-2.5 rounded-xl text-sm font-semibold text-white mt-2">
            Sign In
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Full Name</label>
            <input type="text" id="reg-name" placeholder="Your name" required
              class="w-full px-4 py-2.5 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Email Address</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required
              class="w-full px-4 py-2.5 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
            <input type="password" id="reg-password" placeholder="Min. 6 characters" required
              class="w-full px-4 py-2.5 rounded-xl text-sm" />
          </div>
          <div id="reg-error" class="hidden text-red-400 text-xs bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2"></div>
          <button type="submit" id="reg-btn"
            class="btn-primary w-full py-2.5 rounded-xl text-sm font-semibold text-white mt-2">
            Create Account
          </button>
        </form>

      </div>

      <!-- Footer -->
      <p class="text-center text-xs text-slate-600 mt-6 animate-float delay-2">
        Built with ❤️ for makers and builders
      </p>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    Auth.redirectIfLoggedIn();

    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      
      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTab.classList.add('active');
        loginTab.classList.remove('text-slate-400');
        registerTab.classList.remove('active');
        registerTab.classList.add('text-slate-400');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        registerTab.classList.add('active');
        registerTab.classList.remove('text-slate-400');
        loginTab.classList.remove('active');
        loginTab.classList.add('text-slate-400');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.classList.add('hidden');
      
      UI.setLoading(btn, true, 'Signing in...');
      
      try {
        const data = await API.Auth.login({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value
        });
        
        Auth.setSession(data.token, data.user);
        UI.showToast('Welcome back, ' + data.user.name + '!');
        setTimeout(() => window.location.href = 'pages/dashboard.html', 500);
        
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        UI.setLoading(btn, false, 'Sign In');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const errEl = document.getElementById('reg-error');
      errEl.classList.add('hidden');
      
      UI.setLoading(btn, true, 'Creating account...');
      
      try {
        const data = await API.Auth.register({
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          password: document.getElementById('reg-password').value
        });
        
        Auth.setSession(data.token, data.user);
        UI.showToast('Account created! Welcome, ' + data.user.name + '!');
        setTimeout(() => window.location.href = 'pages/dashboard.html', 500);
        
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        UI.setLoading(btn, false, 'Create Account');
      }
    }
  </script>
</body>
</html>
